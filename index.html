<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>محترف Mohtarf | الصف الأول الثانوي - الوحدة الأولى</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213d; --card:#ffffff; --soft:#eef3ff; --blue:#2b59ff; --purple:#7b3ff2; --green:#12b76a; --red:#f04438; --gold:#ffb703; --orange:#ff7a1a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:18px}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(135deg,#0b1a5c,#3a1c9c,#0a6fb8,#0b1a5c);background-size:400% 400%;animation:bgmove 18s ease infinite;overflow-x:hidden}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg span{position:absolute;bottom:-60px;font-family:'Courier New',monospace;font-weight:700;color:rgba(255,255,255,.14);animation:floatup linear infinite}

header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.logo .mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#ffb703,#ff7a1a);display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3);transform:rotate(-6deg)}
.logo b{font-size:1.7rem;font-weight:900;letter-spacing:.5px;line-height:1}
.logo small{display:block;font-size:.75rem;opacity:.85;font-weight:600;letter-spacing:2px;direction:ltr}
.tools{display:flex;gap:8px}
.tbtn{border:0;border-radius:14px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(4px);font-size:.9rem}
.tbtn:hover{background:rgba(255,255,255,.3)}
main{position:relative;z-index:2;max-width:940px;margin:0 auto;padding:8px 14px 60px}
.card{background:var(--card);border-radius:26px;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.28);margin-bottom:18px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800;margin-bottom:8px;gap:8px;flex-wrap:wrap}

@media(max-width:560px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:3px solid #d7e0ff;background:#f6f8ff;border-radius:18px;padding:12px 14px;cursor:pointer;font:inherit;text-align:right;color:var(--ink);transition:transform .15s,background .2s,border-color .2s}
.opt:hover:not(.lock){transform:scale(1.02);border-color:var(--blue);background:#eaf0ff}
.opt .bd{flex:0 0 auto;min-width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.15rem;padding:0 6px}
.opt .tx{flex:1}
.opt .oar{display:block;font-size:1.3rem;font-weight:800;line-height:1.5}
.opt .oen{display:block;direction:ltr;text-align:left;font-size:.98rem;color:#4a5a80;font-weight:600;font-family:'Segoe UI',Arial,sans-serif}
.opt.sel{border-color:var(--purple);background:#efe6ff}

@keyframes okpulse{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.tfbtn .oar{font-size:1.6rem;text-align:center}
.tfbtn .oen{text-align:center}
.fb{margin-top:16px;border-radius:20px;padding:14px 16px;animation:pop .4s both}
.fb.good{background:#d3f9e4;border:3px solid var(--green)}
.fb.bad{background:#ffe0dd;border:3px solid var(--red)}
.fb .big{font-size:1.6rem;font-weight:900}
.fb .big small{font-size:1rem;font-weight:700;direction:ltr;display:inline-block;margin-inline-start:8px}
.fb .ca{font-weight:800;margin-top:6px;font-size:1.1rem}
.fb .exl{margin-top:6px;font-size:1.05rem;font-weight:600;line-height:1.8}
.fb .exl.en{background:rgba(255,255,255,.6);font-size:.95rem}
.nextrow{display:flex;gap:10px;margin-top:12px}
.btn{border:0;border-radius:18px;padding:14px 22px;font:inherit;font-weight:900;font-size:1.2rem;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 8px 20px rgba(0,0,0,.25)}
.btn small{display:block;font-size:.75rem;font-weight:600;direction:ltr}
.btn.green{background:linear-gradient(135deg,#12b76a,#0fa3b1)}
.btn.wa{background:linear-gradient(135deg,#25d366,#128c7e)}
.btn.grey{background:linear-gradient(135deg,#6b7a99,#4a5670)}
.btn:hover{transform:scale(1.03)}
.btn.full{flex:1}
.emo{position:fixed;left:50%;top:45%;font-size:6rem;z-index:60;pointer-events:none;transform:translate(-50%,-50%);animation:emofly 1.3s ease-out forwards}
@keyframes emofly{0%{opacity:0;transform:translate(-50%,-30%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.score{position:fixed;bottom:14px;left:14px;z-index:5;background:#fff;border-radius:16px;padding:6px 14px;font-weight:900;box-shadow:0 6px 16px rgba(0,0,0,.3);display:none}
/* result */
.res{text-align:center}
.res .trophy{font-size:5rem;animation:bob 1.6s infinite}
.res h2{font-size:2rem;font-weight:900}
.res .sc{font-size:3.4rem;font-weight:900;color:var(--blue);direction:ltr}
.res .stars{font-size:2.4rem;letter-spacing:6px}

</style>

<body>
<div id="bg"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>

<header>
  <a class="logo" href="#" onclick="goHome();return false">
    <div class="mark">م</div>
    <div><b>محترف</b><small>MOHTARF</small></div>
  </a>
  <div class="tools">
    <button class="tbtn" id="btnEN" onclick="toggleEN()">🌐 English ✓</button>
    <button class="tbtn" id="btnSND" onclick="toggleSND()">🔊 الصوت</button>
  </div>
</header>

<main id="app"></main>
<div class="score" id="livescore"></div>

<script>
/* ============ إعدادات ============ */
const WA_NUMBER = '201099920517';   // 01099920517 بصيغة دولية (مصر)
let studentName = '';
let showEN = true, soundOn = true;

/* ============ الخلفية المتحركة ============ */
(function(){
  const bg=document.getElementById('bg');
  const chars=['0','1','01','10','{ }','</>','@','#','💾','📡','💻','🔒','ℹ️','101'];
  for(let i=0;i<34;i++){
    const s=document.createElement('span');
    s.textContent=chars[Math.floor(Math.random()*chars.length)];
    s.style.left=Math.random()*100+'%';
    s.style.fontSize=(18+Math.random()*44)+'px';
    s.style.animationDuration=(12+Math.random()*22)+'s';
    s.style.animationDelay=(-Math.random()*30)+'s';
    bg.appendChild(s);
  }
})();

/* ============ الصوت ============ */
let ac=null;
function audio(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(ac.state==='suspended') ac.resume(); return ac; }
function tone(f,t0,d,type,vol){
  if(!soundOn) return; const c=audio(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+t0;
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.05);
}
function sndOK(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*0.1,0.28,'triangle',0.28)); tone(1568,0.42,0.4,'sine',0.15); }
function sndNO(){ tone(220,0,0.25,'sawtooth',0.22); tone(165,0.18,0.35,'sawtooth',0.22); tone(110,0.4,0.45,'square',0.14); }
function sndClick(){ tone(660,0,0.06,'sine',0.12); }
function sndWin(){ [523.25,659.25,783.99,1046.5,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*0.14,0.32,'triangle',0.3)); }
function sndLose(){ [392,349.23,311.13,261.63].forEach((f,i)=>tone(f,i*0.22,0.4,'sine',0.25)); }
function toggleSND(){ soundOn=!soundOn; document.getElementById('btnSND').textContent=soundOn?'🔊 الصوت':'🔇 صامت'; if(soundOn) sndClick(); }
function toggleEN(){ showEN=!showEN; document.body.classList.toggle('noen',!showEN); document.getElementById('btnEN').textContent=showEN?'🌐 English ✓':'🌐 English ✗'; }

/* ============ المؤثرات البصرية ============ */
const fx=document.getElementById('fx'), fctx=fx.getContext('2d');
function sizeFx(){ fx.width=innerWidth; fx.height=innerHeight; } sizeFx(); addEventListener('resize',sizeFx);
let parts=[], raf=null;
function confetti(n,big){
  const cols=['#ffb703','#12b76a','#2b59ff','#f0387a','#7b3ff2','#25d366','#ff7a1a'];
  for(let i=0;i<n;i++){
    parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*0.45,vx:(Math.random()-.5)*(big?18:12),vy:-Math.random()*(big?18:13)-4,
      g:0.35+Math.random()*0.2,s:6+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,vr:(Math.random()-.5)*0.4,life:100+Math.random()*60});
  }
  if(!raf) loopFx();
}
function loopFx(){
  fctx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;p.life--;
    fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.fillStyle=p.c;fctx.globalAlpha=Math.max(0,Math.min(1,p.life/40));fctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.6);fctx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  if(parts.length){raf=requestAnimationFrame(loopFx);} else {raf=null;fctx.clearRect(0,0,fx.width,fx.height);}
}
function emojiPop(e){ const d=document.createElement('div'); d.className='emo'; d.textContent=e; document.body.appendChild(d); setTimeout(()=>d.remove(),1400); }
function redFlash(){ const f=document.getElementById('flash'); f.style.background='rgba(240,68,56,.35)'; setTimeout(()=>f.style.background='rgba(240,68,56,0)',250); }

/* ============ أدوات بناء المحتوى ============ */
const AL=['أ','ب','ت','ث','ج','ح','خ','د'];
const B=(ar,en)=>`<div class="ar">${ar}</div><div class="en" dir="ltr">${en}</div>`;
const CLS3=[{ar:'1) بيانات',en:'1) Data'},{ar:'2) معلومات',en:'2) Information'},{ar:'3) معرفة',en:'3) Knowledge'}];
const MED3=[{ar:'1) وسائط تعبير',en:'1) Expression media'},{ar:'2) وسائط نقل/إرسال',en:'2) Transmission media'},{ar:'3) وسائط تخزين',en:'3) Recording (storage) media'}];
const PROP3=[{ar:'الثبات (الاستمرارية)',en:'Persistence'},{ar:'القدرة على الاستنساخ (التكرار)',en:'Reproducibility'},{ar:'الانتشار',en:'Propagation'}];
const PROP3b=[{ar:'الاستمرارية (الثبات)',en:'Persistence'},{ar:'القابلية للتكرار (النسخ)',en:'Reproducibility'},{ar:'الانتشار',en:'Propagation'}];
const TFO=[{ar:'✓ صحيحة',en:'✓ True'},{ar:'✗ خاطئة',en:'✗ False'}];
let QID=0;
function mc(src,ar,en,opts,ans,ea,ee,o){o=o||{};return Object.assign({t:'mc',src,ar,en,opts,ans,ea,ee,letters:o.letters||AL,noLetter:o.noLetter||false,ctx:o.ctx||null,two:o.two||false},{});}
function tf(src,ar,en,isTrue,ea,ee,o){o=o||{};return {t:'tf',src,ar,en,opts:TFO,ans:isTrue?0:1,ea,ee,ctx:o.ctx||null,noLetter:true};}
function mu(src,ar,en,opts,ans,ea,ee,o){o=o||{};return {t:'mu',src,ar,en,opts,ans,ea,ee,letters:AL,ctx:o.ctx||null};}

/* ============ الدرس الأول: الأسئلة ============ */
const OPT_TYPES3=[{ar:'وسائط التعبير',en:'Expression media'}];

    <li>3️⃣ 🚫 لا تكشف <b>المعلومات الشخصية</b> لشخص آخر على الإنترنت.<div class="en" dir="ltr">Don’t leak another person’s personal information online.</div></li>
    <li>4️⃣ 🚫 لا تنشر علنًا ما يملك غيرك <b>حقوق المؤلف (Copyright)</b> عليه بدون إذن.<div class="en" dir="ltr">Don’t publicly share content that others hold the copyright on without permission.</div></li>
    <li>5️⃣ 🚫 لا تنتهك <b>خصوصية</b> الآخرين.<div class="en" dir="ltr">Don’t violate other people’s privacy.</div></li>
    <li>6️⃣ 🚫 لا تنشر تعليقات <b>تشهير</b> ولا تتنمر إلكترونيًا (Cyber bullying).<div class="en" dir="ltr">Don’t post defamatory comments or engage in cyber bullying.</div></li></ul>`},
  {c:'#12b76a',ic:'📍',t:'٣) العلامة الجغرافية',te:'3) Geotagging',
   h:B('<span class="hl">العلامة الجغرافية (Geotagging)</span> = معلومات <b>خط الطول وخط العرض</b> تُحفظ داخل الصور والفيديوهات التي تلتقطها بالهاتف الذكي.','<span class="hl">Geotagging</span> = <b>longitude and latitude</b> information saved inside photos and videos taken with a smartphone.')+
   B('<div class="eg">👍 مفيدة: تعرف أين تم التصوير.<br>⚠️ خطر: قد يعرف الآخرون <b>مكان بيتك</b> من صورة التقطتها في المنزل!</div>','<div class="eg">👍 Useful: you can tell where a photo was taken.<br>⚠️ Danger: others may find <b>where your home is</b> from a photo taken there!</div>')},
  {c:'#f04438',ic:'🤥',t:'٤) المعلومات المضللة والشائعات',te:'4) Disinformation and Rumours',
   h:B('<span class="hl">المعلومات المضللة والشائعات (Disinformation and rumours)</span> = معلومات <b>كاذبة</b> تُنشر <b>عمدًا</b>، أو شائعات <b>لا أساس لها</b>.','<span class="hl">Disinformation and rumours</span> = <b>false</b> information spread <b>on purpose</b>, or <b>baseless</b> rumours.')+
   B('<div class="eg">⛔ لا تنشرها أبدًا — حتى لو كنت <b>مجهول الهوية</b>! تذكّر أن المعلومة الكاذبة لها خاصية <b>الاستمرارية</b>: تبقى ولا تُمحى.</div>','<div class="eg">⛔ Never spread them — even if you are <b>anonymous</b>! Remember false information has <b>persistence</b>: it stays and can’t be erased.</div>')},
  {c:'#7b3ff2',ic:'📱',t:'٥) وسائل التواصل الاجتماعي',te:'5) Social Media',
   h:B('<span class="hl">وسائل التواصل الاجتماعي (Social media)</span> = خدمات توفر <b>منصات</b> يتواصل فيها الأفراد مع بعضهم على الإنترنت (وتسمى أيضًا: خدمة الشبكة الاجتماعية SNS).','<span class="hl">Social media</span> = services that provide <b>platforms</b> where people communicate with each other online (also called: Social Networking Service, SNS).')+
   B('<ul><li>👍 أداة ممتازة للتواصل، لكنها قد تصبح <b>خطيرة</b> إذا استُخدمت بشكل غير صحيح.</li><li>🧑‍🤝‍🧑 تذكّر: على الجانب الآخر <b>أشخاص حقيقيون</b> — شارك المعلومات مع مراعاة وجهة نظرهم.</li></ul>','<ul><li>👍 A great tool for communication, but it can become <b>dangerous</b> if misused.</li><li>🧑‍🤝‍🧑 Remember: there are <b>real people</b> on the other side — share information while considering their point of view.</li></ul>')},
  {c:'#f0387a',ic:'⚠️',t:'٦) مشاكل الهواتف الذكية ووسائل التواصل',te:'6) Problems with Smartphones and Social Media',
   h:`<div class="grid3">
    <div class="mini" style="--mc:#f0387a"><div class="mic">🕹️</div><h4>إدمان الإنترنت<small>Internet addiction</small></h4><p>الانغماس المفرط في الإنترنت حتى <b>تتعطل حياتك اليومية</b> (الدراسة والعمل والصحة).</p><p class="en" dir="ltr">Being so absorbed in the Internet that <b>daily life is disrupted</b> (study, work, health).</p></div>
    <div class="mini" style="--mc:#ff7a1a"><div class="mic">🚶📱</div><h4>استخدام الهاتف أثناء المشي<small>Using a smartphone while walking</small></h4><p>استخدام الهاتف وأنت تمشي — <b>خطر</b> عليك وعلى غيرك.</p><p class="en" dir="ltr">Using your phone while walking — <b>dangerous</b> for you and others.</p></div>
    <div class="mini" style="--mc:#7b3ff2"><div class="mic">🕵️‍♂️</div><h4>الجريمة الإلكترونية<small>Cybercrime</small></h4><p>إساءة استخدام <b>الكمبيوتر والشبكات</b> في أنشطة إجرامية.</p><p class="en" dir="ltr">Misuse of <b>computers and networks</b> for criminal activities.</p></div>
    <div class="mini" style="--mc:#2b59ff"><div class="mic">🎭</div><h4>انتحال الشخصية<small>Identity theft</small></h4><p>شخص <b>ينتحل شخصية</b> فرد أو مؤسسة لسرقة الهوية أو <b>كلمات المرور</b>.</p><p class="en" dir="ltr">Someone <b>pretends to be</b> a person or organization to steal identities or <b>passwords</b>.</p></div>
    <div class="mini" style="--mc:#12b76a"><div class="mic">🔓</div><h4>تسريب المعلومات الشخصية<small>Leakage of personal information</small></h4><p>كشف معلومات شخصية <b>يجب أن تبقى سرية</b> لطرف ثالث.</p><p class="en" dir="ltr">Revealing personal information that <b>should stay secret</b> to a third party.</p></div>
   </div>`},
  {c:'#0fa3b1',ic:'📵',t:'٧) آداب استخدام الهاتف الذكي',te:'7) Smartphone Manners',
   h:B('<ul><li>✅ أوقف الهاتف في أماكن مثل <b>السينما</b> و<b>المتاحف</b>.</li><li>❌ لا تستخدمه أثناء <b>القيادة</b> أو <b>المشي</b>.</li><li>❌ لا تكتب تعليقات سلبية عن الآخرين.</li><li>❌ لا ترسل صورتك لغريب قابلته على الإنترنت.</li></ul>','<ul><li>✅ Turn the phone off in places like <b>cinemas</b> and <b>museums</b>.</li><li>❌ Don’t use it while <b>driving</b> or <b>walking</b>.</li><li>❌ Don’t post negative comments about others.</li><li>❌ Don’t send your photo to a stranger you met online.</li></ul>')},
  {c:'#12b76a',ic:'✅',t:'الخلاصة',te:'Summary',
   h:`<ul class="chk">
    <li>⚖️ أخلاقيات المعلومات = التصرف المناسب حتى لو لا يوجد قانون &nbsp;|&nbsp; <span dir="ltr">Ethics = proper behaviour even without laws</span></li>
    <li>📢 فكّر قبل النشر: تنتشر ولا تختفي &nbsp;|&nbsp; <span dir="ltr">Think before posting: it spreads and stays</span></li>
    <li>🚫 لا تشارك ما يملكه غيرك، ولا تكشف بياناتهم، ولا تتنمر &nbsp;|&nbsp; <span dir="ltr">Don’t share others’ property/data, don’t bully</span></li>
    <li>📍 العلامة الجغرافية قد تكشف مكان بيتك &nbsp;|&nbsp; <span dir="ltr">Geotags can reveal your home</span></li>
    <li>🤥 لا تنشر شائعات أو معلومات مضللة حتى بشكل مجهول &nbsp;|&nbsp; <span dir="ltr">No rumours, even anonymously</span></li>
    <li>⚠️ ٥ مشاكل: إدمان – مشي بالهاتف – جريمة إلكترونية – انتحال – تسريب &nbsp;|&nbsp; <span dir="ltr">5 problems</span></li></ul>`}
 ]
}
];

/* ============ الشاشات ============ */
const app=document.getElementById('app');
function goHome(){
  hideScore();
  app.innerHTML=`
  <div class="hero"><h1>الصف الأول الثانوي — الوحدة الأولى<small>Grade 1 Secondary — Unit 1 · Introduction to ICT</small></h1></div>
  <div class="name-box" id="nameBox">
    <label for="nm">✏️ اكتب اسمك أولًا<small>Write your name first</small></label>
    <input id="nm" type="text" maxlength="40" placeholder="اسم الطالب / Student name" value="${escapeHtml(studentName)}" autocomplete="off">
  </div>
  <div class="lessons">
    <button class="lbtn l1" onclick="openLesson(0)"><span class="ic">📊</span><h2>الدرس الأول</h2><p>المعلومات والوسائط</p><p class="en">Lesson 1 · Information &amp; Media</p><span class="cnt">${Q1.length} سؤال | ${Q1.length} questions</span></button>
    <button class="lbtn l2" onclick="openLesson(1)"><span class="ic">🛡️</span><h2>الدرس الثاني</h2><p>أخلاقيات المعلومات</p><p class="en">Lesson 2 · Information Ethics</p><span class="cnt">${Q2.length} سؤال | ${Q2.length} questions</span></button>
  </div>`;
  window.scrollTo(0,0);
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function needName(){
  const v=(document.getElementById('nm')||{}).value||studentName;
  studentName=(v||'').trim();
  if(!studentName){ const b=document.getElementById('nameBox'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); sndNO(); document.getElementById('nm').focus(); return false; }
  return true;
}
function openLesson(i,tab){
  if(!studentName && !needName()) return;
  if(document.getElementById('nm')) { if(!needName()) return; }
  sndClick(); showLesson(i,tab||'ex');
}
function showLesson(i,tab){
  hideScore();
  const L=LESSONS[i];
  let html=`<div class="topbar"><button class="back" onclick="goHome()">↩ الرئيسية | Home</button><div class="hello">👋 أهلًا ${escapeHtml(studentName)}</div></div>
   <div class="hero" style="margin-bottom:10px"><h1>${L.icon} ${L.name}: ${L.title}<small>${L.nameEn}: ${L.titleEn}</small></h1></div>
   <div class="tabs"><button class="tab ${tab==='ex'?'on':''}" onclick="showLesson(${i},'ex')">📖 الشرح<small>Explanation</small></button>
   <button class="tab ${tab==='q'?'on':''}" onclick="showLesson(${i},'q')">📝 الأسئلة (${L.Q.length})<small>Questions</small></button></div>`;
  if(tab==='ex'){
    L.cards.forEach((c,k)=>{
      html+=`<section class="ex" style="--c:${c.c};animation-delay:${k*0.06}s"><h3><span class="ic">${c.ic}</span>${c.t}<small>${c.te}</small></h3>${c.h}</section>`;
    });
    html+=`<button class="gobtn" onclick="showLesson(${i},'q')">📝 ابدأ أسئلة هذا الدرس<small>Start this lesson’s questions</small></button>`;
  } else {
    html+=`<div class="card" style="text-align:center"><div style="font-size:4rem">📝</div>
     <h2 style="font-size:1.6rem;font-weight:900">أسئلة ${L.name}</h2>
     <p class="ar" style="font-size:1.1rem">${L.Q.length} سؤالًا من الكتاب (موضوعية فقط) — الأسئلة والاختيارات بالعربية والإنجليزية.<br>🎵 ستسمع صوتًا وتشاهد مؤثرات عند الإجابة. وفي النهاية <b>ترسل نتيجتك لواتساب</b>.</p>
     <p class="en" dir="ltr">${L.Q.length} objective questions from the book — Arabic + English. You’ll hear sounds and see effects for right/wrong answers, and at the end you can <b>send your result to WhatsApp</b>.</p>
     <button class="gobtn" onclick="startQuiz(${i})">▶️ ابدأ الاختبار<small>Start the quiz</small></button></div>`;
  }
  app.innerHTML=html; window.scrollTo(0,0);
}

/* ============ الاختبار ============ */
let S=null;
function startQuiz(i){
  audio(); sndClick();
  S={i:i,L:LESSONS[i],idx:0,score:0,wrong:[],answered:false,sel:[]};
  showScore(); renderQ();
}
function showScore(){ const e=document.getElementById('livescore'); e.style.display='block'; updScore(); }
function hideScore(){ document.getElementById('livescore').style.display='none'; }
function updScore(){ if(S) document.getElementById('livescore').textContent='⭐ '+S.score+' / '+S.L.Q.length; }
function renderQ(){
  const L=S.L, q=L.Q[S.idx], n=L.Q.length;
  S.answered=false; S.sel=[];
  const letters=q.letters||AL;
  let opts='';
  q.opts.forEach((o,k)=>{
    const badge=(q.noLetter)?(q.t==='tf'?(k===0?'✓':'✗'):(k+1)):letters[k];
    opts+=`<button class="opt ${q.t==='tf'?'tfbtn':''}" data-k="${k}" onclick="pick(${k})"><span class="bd">${badge}</span><span class="tx"><span class="oar">${o.ar}</span><span class="oen">${o.en}</span></span></button>`;
  });
  const hint=q.t==='mu'?`<div class="hint">☑️ اختر كل الإجابات الصحيحة ثم اضغط «تأكيد» &nbsp;|&nbsp; <span dir="ltr">Select all correct answers, then press “Check”</span></div>`:'';
  app.innerHTML=`
   <div class="topbar"><button class="back" onclick="if(confirm('الخروج من الاختبار؟ / Leave the quiz?')){showLesson(${S.i},'q')}">↩ خروج | Exit</button><div class="hello">👋 ${escapeHtml(studentName)}</div></div>
   <div class="qhead"><span>${L.icon} ${L.name}</span><span>سؤال ${S.idx+1} من ${n} &nbsp;|&nbsp; <span dir="ltr">Q ${S.idx+1}/${n}</span></span></div>
   <div class="pbar"><i style="width:${(S.idx/n)*100}%"></i></div>
   <div class="card qcard" id="qc">
     <span class="qtag">${q.src}</span>
     ${q.ctx?`<div class="ctx"><div class="ar">${q.ctx.ar}</div><div class="en" dir="ltr">${q.ctx.en}</div></div>`:''}
     <div class="qtxt">${q.ar}</div><div class="qen">${q.en}</div>
     ${hint}
     <div class="opts ${q.two?'two':''}" id="opts">${opts}</div>
     ${q.t==='mu'?`<div class="nextrow"><button class="btn green full" id="chk" onclick="checkMulti()">✔ تأكيد الإجابة<small>Check answer</small></button></div>`:''}
     <div id="fbx"></div>
   </div>`;
  window.scrollTo(0,0);
  if(!showEN) document.body.classList.add('noen');
}
function pick(k){
  if(S.answered) return;
  const q=S.L.Q[S.idx];
  if(q.t==='mu'){
    sndClick();
    const p=S.sel.indexOf(k); if(p>=0) S.sel.splice(p,1); else S.sel.push(k);
    document.querySelectorAll('#opts .opt').forEach(b=>b.classList.toggle('sel',S.sel.includes(+b.dataset.k)));
    return;
  }
  S.answered=true;
  const ok=(k===q.ans);
  const btns=document.querySelectorAll('#opts .opt');
  btns.forEach(b=>{b.classList.add('lock');});
  btns[k].classList.add(ok?'ok':'no');
  if(!ok) btns[q.ans].classList.add('miss');
  finishAnswer(ok,q, ok?null:q.opts[q.ans]);
}
function checkMulti(){
  if(S.answered) return;
  const q=S.L.Q[S.idx];
  if(!S.sel.length){ const c=document.getElementById('qc'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); sndNO(); return; }
  S.answered=true;
  const correct=q.ans.slice().sort().join(',');
  const mine=S.sel.slice().sort().join(',');
  const ok=(correct===mine);
  document.querySelectorAll('#opts .opt').forEach(b=>{
    const k=+b.dataset.k; b.classList.add('lock'); b.classList.remove('sel');
    const isC=q.ans.includes(k), isS=S.sel.includes(k);
    if(isC&&isS) b.classList.add('ok'); else if(!isC&&isS) b.classList.add('no'); else if(isC&&!isS) b.classList.add('miss');
  });
  document.getElementById('chk').classList.add('hidden');
  finishAnswer(ok,q, ok?null:{ar:q.ans.map(k=>q.opts[k].ar).join(' ، '),en:q.ans.map(k=>q.opts[k].en).join(', ')});
}
function finishAnswer(ok,q,corr){
  if(ok){ S.score++; sndOK(); confetti(90,false); emojiPop(['🎉','😃','🌟','👏','🥳'][Math.floor(Math.random()*5)]); }
  else { S.wrong.push(S.idx+1); sndNO(); redFlash(); emojiPop(['😢','😞','🙈','💔'][Math.floor(Math.random()*4)]); }
  updScore();
  const last=(S.idx===S.L.Q.length-1);
  const msgOK=['أحسنت! 🎉','ممتاز! 🌟','رائع جدًا! 👏','إجابة صحيحة! ✅'], msgOKen=['Well done!','Excellent!','Great job!','Correct!'];
  const r=Math.floor(Math.random()*4);
  document.getElementById('fbx').innerHTML=`
   <div class="fb ${ok?'good':'bad'}">
     <div class="big">${ok?msgOK[r]:'إجابة خاطئة 😢'} <small>${ok?msgOKen[r]:'Wrong answer'}</small></div>
     ${ok?'':`<div class="ca">✅ الإجابة الصحيحة: ${corr.ar} <div class="en" dir="ltr" style="margin:4px 0 0">Correct answer: ${corr.en}</div></div>`}
     <div class="exl">💡 ${q.ea}</div><div class="exl en" dir="ltr">💡 ${q.ee}</div>
   </div>
   <div class="nextrow"><button class="btn full" onclick="${last?'showResult()':'nextQ()'}">${last?'🏁 عرض النتيجة':'التالي ⬅️'}<small>${last?'Show my result':'Next'}</small></button></div>`;
  document.getElementById('fbx').scrollIntoView({behavior:'smooth',block:'center'});
}
function nextQ(){ sndClick(); S.idx++; renderQ(); }

/* ============ النتيجة + واتساب ============ */
function grade(p){ if(p>=90) return ['ممتاز 🏆','Excellent']; if(p>=75) return ['جيد جدًا 🌟','Very good']; if(p>=60) return ['جيد 👍','Good']; if(p>=50) return ['مقبول 🙂','Pass']; return ['يحتاج إلى مراجعة 📚','Needs review']; }
function showResult(){
  hideScore();
  const n=S.L.Q.length, sc=S.score, p=Math.round(sc/n*100), g=grade(p);
  const stars=p>=90?'⭐⭐⭐':p>=70?'⭐⭐':p>=50?'⭐':'💪';
  if(p>=50){ sndWin(); confetti(220,true); setTimeout(()=>confetti(160,true),500); } else { sndLose(); }
  app.innerHTML=`
   <div class="card res">
     <div class="trophy">${p>=90?'🏆':p>=70?'🥇':p>=50?'🎖️':'📚'}</div>
     <h2>${escapeHtml(studentName)}</h2>
     <p class="ar">نتيجتك في ${S.L.name}: ${S.L.title}</p>
     <p class="en" dir="ltr">Your result in ${S.L.nameEn}: ${S.L.titleEn}</p>
     <div class="sc">${sc} / ${n}</div>
     <div class="sc" style="font-size:2rem">${p}%</div>
     <div class="stars">${stars}</div>
     <div class="msg">${g[0]} <span dir="ltr" style="font-size:1rem">(${g[1]})</span></div>
     ${S.wrong.length?`<div class="wrong">❌ الأسئلة الخاطئة: ${S.wrong.join(' ، ')}<div class="en" dir="ltr" style="margin:4px 0 0">Wrong questions: ${S.wrong.join(', ')}</div></div>`:`<div class="wrong" style="background:#e9fbf1">🎯 كل إجاباتك صحيحة! | All answers correct!</div>`}
     <div class="btns">
       <button class="btn wa" onclick="sendWA()">📲 إرسال النتيجة إلى واتساب<small>Send my result to WhatsApp</small></button>
       <button class="btn" onclick="startQuiz(${S.i})">🔄 إعادة الاختبار<small>Try again</small></button>
       <button class="btn green" onclick="showLesson(${S.i},'ex')">📖 مراجعة الشرح<small>Review the explanation</small></button>
       <button class="btn grey" onclick="goHome()">🏠 الرئيسية<small>Home</small></button>
     </div>
   </div>`;
  window.scrollTo(0,0);
}
function sendWA(){
  const n=S.L.Q.length, sc=S.score, p=Math.round(sc/n*100), g=grade(p);
  const lines=[
    '📊 نتيجة اختبار — منصة محترف (Mohtarf)',
    '👤 الاسم: '+studentName,
    '🏫 الصف: الأول الثانوي — الوحدة الأولى',
    '📖 '+S.L.name+': '+S.L.title+' ('+S.L.titleEn+')',
    '✅ الدرجة: '+sc+' من '+n+' ('+p+'%)',
    '🏅 التقدير: '+g[0]+' / '+g[1],
    S.wrong.length?('❌ الأسئلة الخاطئة: '+S.wrong.join('، ')):'🎯 كل الإجابات صحيحة'
  ];
  const url='https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(lines.join('\n'));
  window.open(url,'_blank');
}

goHome();
</script>
</body>
</html>
